<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Dynamic Task Manager</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <main class="app">
    <h1>Secure Dynamic Task Manager</h1>

    <div class="controls">
      <input type="text" id="taskInput" placeholder="Enter a task">
      <button id="addTaskBtn">Add Task</button>
      <button id="loadSamplesBtn">Load Sample Tasks</button>
    </div>

    <p id="taskMessage" class="message" role="alert"></p>

    <section class="summary">
      <div>Total Tasks: <span id="totalCount">0</span></div>
      <div>Pending: <span id="pendingCount">0</span></div>
      <div>Completed: <span id="completedCount">0</span></div>
    </section>

    <ul id="taskList"></ul>
  </main>
</body>
</html>
